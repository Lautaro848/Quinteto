<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12151c">
<title>Quinteto · página no encontrada</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px;
    background: #12151c; color: #eef1f6; text-align: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .ball { font-size: 3rem; }
  h1 { font-size: 1.2rem; margin: 0; }
  p { color: #8b94a7; font-size: .92rem; max-width: 22rem; margin: 0; }
  a {
    background: #e8622c; color: #fff; text-decoration: none; font-weight: 700;
    padding: 12px 22px; border-radius: 10px; margin-top: 6px;
  }
</style>
</head>
<body>
  <div class="ball">🏀</div>
  <h1>Esa página no existe</h1>
  <p>El link al que entraste no corresponde a ninguna pantalla de Quinteto. Abrí la planilla desde el inicio.</p>
  <a id="go" href="./">Abrir Quinteto</a>

<script>
  /* Sube un nivel hasta el inicio de la app. Al ser relativo funciona igual
     en un subpath (usuario.github.io/Quinteto/) que en un dominio propio,
     y la comparación con la URL actual evita cualquier bucle de redirects. */
  (function () {
    var up = location.pathname.endsWith("/") ? "../" : "./";
    var target = new URL(up, location.href).href;
    document.getElementById("go").href = target;
    if (target !== location.href) location.replace(target);
  })();
</script>
</body>
</html>
